[pytest]
# 第一行固定为pytest，声明此配置文件为pytest的配置文件

# -s表示输出print打印信息，-v表示输出详细信息，--html表示生成测试报告，报告路径为./report/report.html
addopts = -s -v --alluredir=temps --clean-alluredir --driver chrome

#测试用例的路径，pytest会自动搜索该路径下的所有测试用例文件
testpaths = ./script

#测试用例文件的匹配规则，pytest会自动匹配该规则下的测试用例文件
python_files = test*.py

#测试用例类的匹配规则，pytest会自动匹配该规则下的测试用例类
python_classes = Test*

#测试用例函数的匹配规则，pytest会自动匹配该规则下的测试用例函数
python_functions = test*

# 标记
markers =
    smoke: 冒烟测试
    regression:回归测试
    web: UI测试
    api: 接口测试


# 日志相关配置

# 日志文件路径
log_file = ./logs/pytest.log

# 日志级别
log_file_level = info

# 日志格式
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] : %(message)s

# 日志时间格式
log_file_date_format = %Y-%m-%d %H:%M:%S


; 记录用例执行结果
result_log_enable = 1

; 记录用例分割线
result_log_separator = 1

; 分割线等级
result_log_level_separator = warning

; 异常信息等级
result_log_level_verbose = info
